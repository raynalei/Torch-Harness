# Prepare the scientific profile once; then supply each PDB via --pdb.
name: ppiflow_auto
work_dir: /lustre/project/harness/runs
path_mappings:
  - local: /lustre/project
    remote: /lustre/project

generators:
  ppiflow:
    service:
      url: http://127.0.0.1:8010
      health_path: /openapi.json
      poll_interval: 10
      job_timeout: 86400
    request:
      mode: nanobody
      name: ppiflow_auto
      antigen_pdb: /lustre/project/inputs/target.pdb
      antigen_chain: A
      framework_dir: /lustre/project/inputs/frameworks
      heavy_chain: B
      specified_hotspots: A4,A10
      samples_per_target: 10
      num_timesteps: 200
    chains:
      target: [A]
      binder: [B]
      refold_map: {A: A, B: B}
    # Construct AF3-dialect TorchFold input from generated chain sequences.
    fold_template: null
    fold_seeds: [1]
    # Every passing structure refolds, including distinct poses of one sequence.
    per_source_refold_limit: null
    deduplicate_sequences: false

evaluation:
  af3score:
    url: http://127.0.0.1:8040
    poll_interval: 10
    metric_fields: {iptm: iptm}
  af3score_options:
    run_data_pipeline: false
    run_inference: true
    init_guess: true
    seed: 10
  min_af3score_iptm: 0.5
  torchfold:
    url: http://127.0.0.1:8050
    poll_interval: 10
    metric_fields: {iptm: iptm}
  torchfold_options:
    run_data_pipeline: false
    num_diffusion_samples: 2
  dockq_python: /lustre/project/tools/dockq/bin/python
  # Report refold confidence and DockQ for all AF3Score survivors.
  # Raise these only if you also want post-refold acceptance thresholds.
  min_refold_iptm: 0
  min_dockq: 0
  # Rosetta is omitted: this pipeline stops after DockQ.

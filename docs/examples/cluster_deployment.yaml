# Autonomous score-routing deployment configuration, not a historical design/run_config.
# This is also bundled beside defaults.py as the automatic deployment fallback.
# To persist operator edits, import this file once:
# ddeharness protein-design models register --services-file cluster_deployment.yaml
# Add --replace-existing only to deliberately update existing registrations/settings.
# Restart Harness after importing. Runtime config remains JSON; this source may be YAML.
# No target PDB, framework, hotspot or fixed-residue information belongs here.
# Known paths/ports below come from this deployment's supplied scripts/configuration.
# slurm-api.invalid is intentional: Harness resolves the sbatch allocation hostname.
# Source/checkpoint/algorithm defaults remain in each API sbatch/main.py.
# request_defaults stay empty so HTTP requests do not override those server defaults.
# environment variables affect sbatch only if that script actually honors them.
model_services:
  ppiflow:
    kind: ppiflow
    max_samples: 1000
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8010
      health_path: /openapi.json
      sbatch_script: /lustre/grp/cmclab/leiy/ppiflow_api/ppiflow-api.sbatch
      sbatch_resolve_host: true
      environment:
        PPIFLOW_ROOT: /lustre/grp/cmclab/leiy/v3_basic
        PPIFLOW_PYTHON: /lustre/grp/cmclab/leiy/conda_envs/ppi_env/bin/python
        PPIFLOW_API_WORK: /lustre/grp/cmclab/leiy/ppiflow_api_jobs
        # binder-design is NOT under PPIFLOW_ROOT; retain its actual location in
        # the deployed API's own configuration, never derive it from this root.
  torchcraft:
    kind: torchcraft
    max_samples: 1000
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8020  # Confirm this port against the actual script.
      health_path: /openapi.json
      sbatch_script: /lustre/grp/cmclab/leiy/torchcraft_api/torchcraft-api.sbatch
      sbatch_resolve_host: true
      # Its sbatch must activate its own environment and resolve source/weights.
      environment: {}
  af3score:
    kind: af3score
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8030
      sbatch_script: /lustre/grp/cmclab/leiy/af3score_api/af3score-api.sbatch
      sbatch_resolve_host: true
      environment: {}
  torchfold:
    kind: torchfold
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8040
      sbatch_script: /lustre/grp/cmclab/leiy/torchfold_api/torchfold-api.sbatch
      sbatch_resolve_host: true
      environment: {}
  rosetta:
    kind: rosetta
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service: &direct_rosetta
      backend: slurm
      python: /lustre/grp/cmclab/leiy/conda_envs/ppi_env/bin/python
      partition: sugon
      cpus: 4
      memory: 16G
      walltime: '04:00:00'
      metric_fields: {interface_dg: dG_separated}
      environment: {OMP_NUM_THREADS: '4'}
  torchopt:
    kind: torchopt
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8060  # Confirm against actual script.
      status_field: state
      sbatch_script: /lustre/grp/cmclab/leiy/torchoptimization-api/torchopt_api.sbatch
      sbatch_resolve_host: true
      environment: {}
  torchscore:
    kind: torchscore
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8070
      sbatch_script: /lustre/grp/cmclab/leiy/Torchscore-api/torchscore-api.sbatch
      sbatch_resolve_host: true
      metric_fields: {iptm: iptm, ptm: ptm}
      environment: {}
  rfd4:
    kind: rfd4
    max_samples: 512
    allowed_input_roots: [/lustre/grp/cmclab]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8080
      health_service: rfd4
      health_job_id: true
      sbatch_script: /lustre/grp/cmclab/leiy/rfd4_api/rfd4_api.sbatch
      sbatch_chdir: /lustre/grp/cmclab/leiy/rfd4_api
      environment:
        RFD4_API_DIR: /lustre/grp/cmclab/leiy/rfd4_api
        RFD4_PORT: '8080'
        RFD4_SIF: /lustre/grp/cmclab/leiy/containers/rfd4-proteina-cu12-amd64.sif
        RFD4_WEIGHTS: /lustre/grp/cmclab/leiy/models/rfd4-proteina
        RFD4_INPUTS: /lustre/grp/cmclab/leiy/rfd4_api_inputs
        RFD4_JOBS: /lustre/grp/cmclab/leiy/rfd4_api_jobs
  proteinmpnn:
    kind: proteinmpnn
    max_samples: 512
    allowed_input_roots: [/lustre/grp/cmclab/leiy, /lustre/grp/cmclab/share]
    request_defaults: {}
    service:
      url: http://slurm-api.invalid:8090
      health_service: proteinmpnn
      health_job_id: true
      sbatch_script: /lustre/grp/cmclab/leiy/proteinmpnn_api/proteinmpnn_api.sbatch
      sbatch_chdir: /lustre/grp/cmclab/leiy/proteinmpnn_api
      environment:
        PROTEINMPNN_API_PYTHON: /lustre/grp/cmclab/leiy/conda_envs/proteinmpnn_api/bin/python
        PROTEINMPNN_SIF: /lustre/grp/cmclab/leiy/containers/proteinmpnn.sif
        PROTEINMPNN_WEIGHTS: /lustre/grp/cmclab/leiy/models/proteinMPNN/v_48_020.pt
        PROTEINMPNN_WORK: /lustre/grp/cmclab/leiy/proteinmpnn_api_jobs
        PROTEINMPNN_INPUT_ROOTS: /lustre/grp/cmclab/leiy:/lustre/grp/cmclab/share
workflow_defaults:
  work_dir: /lustre/grp/cmclab/leiy/harness/runs
  path_mappings:
    # This assumes Harness runs on the cluster and sees this same absolute mount.
    # Change local if Harness mounts Lustre elsewhere; remote remains cluster path.
    - {local: /lustre/grp/cmclab, remote: /lustre/grp/cmclab}
  evaluation:
    scoring_backend: torchscore
    rosetta: *direct_rosetta
    dockq_python: /lustre/grp/cmclab/leiy/conda_envs/ppi_env/bin/python
    rosetta_residue_glob: '*.out'
  autonomous:
    decision_policy: planner
    planner_layout: two_stage
    # Existing finite two-stage decisions; no global round/sample/batch caps.
design_profiles:
  # Supply chain IDs in each task. An omitted refold_map preserves those IDs.
  vhh:
    generators:
      ppiflow:
        request: {mode: nanobody}
      torchcraft:
        request: {mode: vhh}
  antibody:
    generators:
      ppiflow:
        # Supply framework_dir and cdr_length in the current task.
        request: {mode: antibody}
  minibinder:
    generators:
      ppiflow:
        # Supply required design lengths with generator_overrides in current task.
        request: {mode: binder}
      torchcraft:
        # Supply design_length through the current task generator_overrides.
        request: {mode: mini_binder}
# The task/agent chooses generators: [ppiflow] or [torchcraft] explicitly.
# CSV column names and indexing must come from the actual TorchCraft reader.
target_adapters:
  torchcraft:
    hotspot_numbering: pdb_residue_id
    csv_id_column: target
    csv_sequence_column: real_sequence
    csv_optional: true

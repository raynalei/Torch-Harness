# 7n0a paired VH/VL initial round. API servers are started exclusively through sbatch.
# Paths are deployment-specific. Confirm scripts, shared storage and DockQ before launch.
# PPIFlow API must accept config/model_weights/output_dir and forward them to sample_antibody.
# PYTHONPATH is configured in the API/service environment, not as an HTTP request argument.
name: 7n0a
work_dir: /lustre/grp/cmclab/leiy/harness/runs
path_mappings:
- local: /lustre/grp/cmclab
  remote: /lustre/grp/cmclab
generators:
  ppiflow:
    service:
      url: http://127.0.0.1:8010
      health_path: /openapi.json
      status_field: status
      exit_code_field: exit_code
      require_exit_code: true
      sbatch_script: /lustre/grp/cmclab/leiy/ppiflow_api/ppiflow-api.sbatch
      sbatch_state_file: /lustre/grp/cmclab/leiy/ppiflow_api/api-state/ppiflow.json
      sbatch_resolve_host: true
      startup_timeout: 1800
      startup_poll_interval: 5
    request:
      mode: antibody
      name: 7n0a
      antigen_pdb: /lustre/grp/cmclab/share/guoly/app_code/test_data/antigen/clean_7n0a.pdb
      antigen_chain: C
      specified_hotspots: C4,C10,C117,C125
      framework_dir: /lustre/grp/cmclab/share/guoly/app_code/test_data/framework_scfv
      heavy_chain: A
      light_chain: B
      cdr_length: CDRH1,8-9,CDRH2,7-8,CDRH3,10-20,CDRL1,7-7,CDRL2,3-3,CDRL3,9-11
      config: /lustre/grp/cmclab/share/guoly/app_code/v3_basic/configs/test_antibody_v3.yaml
      samples_per_target: 5
      num_timesteps: 200
      model_weights: /lustre/grp/cmclab/share/changdr/model/20260618_distill/model_214.ckpt.enc
      output_dir: /lustre/grp/cmclab/leiy/test/
    chains:
      target:
      - C
      binder:
      - A
      - B
      refold_map:
        C: C
        A: A
        B: B
    fold_template: null
    structure_glob: '*.pdb'
    per_source_refold_limit: null
    deduplicate_sequences: false
evaluation:
  af3score_options:
    run_data_pipeline: True
    run_inference: true
    init_guess: true
    num_workers: 4
    seed: 10
    write_fold_input_json_file: false
  af3score:
    url: http://127.0.0.1:8030
    metrics_field: metrics
    metric_fields:
      iptm: iptm
    sbatch_script: /lustre/grp/cmclab/leiy/af3score_api/af3score-api.sbatch
    sbatch_state_file: /lustre/grp/cmclab/leiy/af3score_api/api-state/af3score.json
    sbatch_resolve_host: true
    startup_timeout: 1800
    startup_poll_interval: 5
  torchfold:
    url: http://127.0.0.1:8040
    metric_fields:
      iptm: iptm
    sbatch_script: /lustre/grp/cmclab/leiy/torchfold_api/torchfold-api.sbatch
    sbatch_state_file: /lustre/grp/cmclab/leiy/torchfold_api/api-state/torchfold.json
    sbatch_resolve_host: true
    startup_timeout: 1800
    startup_poll_interval: 5
  rosetta:
    url: http://127.0.0.1:8050
    metrics_field: metrics
    metric_fields:
      interface_dg: dG_separated
    sbatch_script: /lustre/grp/cmclab/leiy/rosetta_biotools_api/rosetta-api.sbatch
    sbatch_state_file: /lustre/grp/cmclab/leiy/rosetta_api/api-state/rosetta.json
    sbatch_resolve_host: true
    startup_timeout: 1800
    startup_poll_interval: 5
  torchfold_options:
    run_data_pipeline: false
    num_diffusion_samples: 2
  rosetta_options:
    pack_input: false
    pack_separated: true
  dockq_python: /lustre/grp/cmclab/leiy/conda_envs/ppi_env/bin/python
  dockq_timeout: 300
  min_af3score_iptm: 0.5
  min_refold_iptm: 0.8
  min_dockq: 0.49

# Paired VH/VL antibody example with embedded service deployment settings.
# For the registered-service autonomous VHH workflow see autonomous_round_registered.yaml.
# 7n0a paired VH/VL initial round. API servers are started exclusively through sbatch.
# Paths are deployment-specific. Confirm scripts, shared storage and DockQ before launch.
# PPIFlow API must accept config/model_weights/output_dir and forward them to sample_antibody.
# PYTHONPATH is configured in the API/service environment, not as an HTTP request argument.
name: 7n0a
work_dir: /shared/project/harness/runs
path_mappings:
- local: /shared/project
  remote: /shared/project
generators:
  ppiflow:
    service:
      url: http://slurm-api.invalid:8010
      health_path: /openapi.json
      status_field: status
      exit_code_field: exit_code
      require_exit_code: true
      sbatch_script: /shared/project/apis/ppiflow-api.sbatch
      sbatch_state_file: /shared/project/api-state/ppiflow.json
      sbatch_resolve_host: true
      startup_timeout: 1800
      startup_poll_interval: 5
    request:
      mode: antibody
      name: 7n0a
      antigen_pdb: /shared/project/inputs/target.pdb
      antigen_chain: C
      heavy_chain: A
      light_chain: B
      specified_hotspots: C4,C10,C117,C125
      framework_dir: /shared/project/inputs/frameworks
      cdr_length: CDRH1,8-9,CDRH2,7-8,CDRH3,10-20,CDRL1,7-7,CDRL2,3-3,CDRL3,9-11
      config: /shared/project/configs/ppiflow-antibody.yaml
      samples_per_target: 5
      num_timesteps: 200
      model_weights: /shared/project/models/ppiflow-antibody.ckpt
      output_dir: /shared/project/outputs/ppiflow/
    fold_template: null
    structure_glob: '*.pdb'
    deduplicate_sequences: false
evaluation:
  scoring_backend: torchscore
  torchscore:
    url: http://slurm-api.invalid:8070
    metrics_field: metrics
    metric_fields:
      iptm: iptm
      ptm: ptm
    sbatch_script: /shared/project/apis/torchscore-api.sbatch
    sbatch_resolve_host: true
    startup_timeout: 1800
    startup_poll_interval: 5
  torchfold:
    url: http://slurm-api.invalid:8040
    metric_fields:
      iptm: iptm
    sbatch_script: /shared/project/apis/torchfold-api.sbatch
    sbatch_state_file: /shared/project/api-state/torchfold.json
    sbatch_resolve_host: true
    startup_timeout: 1800
    startup_poll_interval: 5
  rosetta_fix:
    source_dir: /shared/project/PPIFlow
    rosetta_bin: /shared/project/rosetta/rosetta_scripts.default.linuxgccrelease
    native_xml: /shared/project/PPIFlow/steps/rosetta/native.xml
    python: /shared/project/envs/ppiflow/bin/python
    interface_dist: 12.0
    timeout: 7200
  torchfold_options:
    run_data_pipeline: false
    num_diffusion_samples: 2
  dockq_python: /shared/project/tools/dockq/bin/python
  dockq_timeout: 300
  min_refold_iptm: 0.8
  min_dockq: 0.49

[plugin]
id = "protein-design"
version = "1.0.0"
display_name = "Protein Design"
opendde_harness = ">=0.1"
bundled = true
enabled_by_default = true

[plugin.contributes]
skills_dirs = ["skills"]
readiness = "opendde_harness.plugin.protein_design.readiness:compute_configured"

[plugin.contributes.tool_description_notes]
bash = "Protein Design models run through their configured compute service; this shell does not enter that container. Use protein_design_context and the Protein Design tools for model execution."

[[plugin.contributes.tools]]
name = "protein_design_context"
factory = "opendde_harness.plugin.protein_design.tools.control:make_context_tool"

[[plugin.contributes.tools]]
name = "protein_design_start"
factory = "opendde_harness.plugin.protein_design.tools.control:make_start_tool"

[[plugin.contributes.tools]]
name = "protein_design_status"
factory = "opendde_harness.plugin.protein_design.tools.control:make_status_tool"

[[plugin.contributes.tools]]
name = "protein_design_adjust"
factory = "opendde_harness.plugin.protein_design.tools.control:make_adjust_tool"

[[plugin.contributes.tools]]
name = "protein_design_stop"
factory = "opendde_harness.plugin.protein_design.tools.control:make_stop_tool"

[[plugin.contributes.tools]]
name = "protein_design_candidates"
factory = "opendde_harness.plugin.protein_design.tools.control:make_candidates_tool"

[[plugin.contributes.tools]]
name = "protein_design_search_target_msa"
factory = "opendde_harness.plugin.protein_design.tools.control:make_target_msa_search_tool"

[[plugin.contributes.tools]]
name = "protein_model_list"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_list_tool"

[[plugin.contributes.tools]]
name = "protein_model_submit"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_submit_tool"

[[plugin.contributes.tools]]
name = "protein_model_status"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_status_tool"

[[plugin.contributes.tools]]
name = "protein_model_results"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_results_tool"

[[plugin.contributes.tools]]
name = "protein_model_cancel"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_cancel_tool"

[[plugin.contributes.tools]]
name = "protein_model_ppiflow"
factory = "opendde_harness.plugin.protein_design.tools.models:make_ppiflow_tool"

[[plugin.contributes.tools]]
name = "protein_model_torchcraft"
factory = "opendde_harness.plugin.protein_design.tools.models:make_torchcraft_tool"

[[plugin.contributes.tools]]
name = "protein_model_torchfold"
factory = "opendde_harness.plugin.protein_design.tools.models:make_torchfold_tool"

[[plugin.contributes.tools]]
name = "protein_model_af3score"
factory = "opendde_harness.plugin.protein_design.tools.models:make_af3score_tool"

[[plugin.contributes.tools]]
name = "protein_model_rosetta"
factory = "opendde_harness.plugin.protein_design.tools.models:make_rosetta_tool"

[[plugin.contributes.tools]]
name = "protein_initial_round_start"
factory = "opendde_harness.plugin.protein_design.tools.initial_round:make_initial_round_start_tool"

[[plugin.contributes.tools]]
name = "protein_initial_round_status"
factory = "opendde_harness.plugin.protein_design.tools.initial_round:make_initial_round_status_tool"

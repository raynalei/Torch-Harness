[plugin]
id = "protein-design"
version = "1.0.0"
display_name = "Torch-Harness Protein Design"
opendde_harness = ">=0.1"
bundled = true
enabled_by_default = true

[plugin.contributes]
skills_dirs = ["skills"]
readiness = "opendde_harness.plugin.protein_design.readiness:models_configured"

[plugin.contributes.tool_description_notes]
bash = "Protein models run through registered Slurm model APIs; analysis uses native backends. Use protein_design_context and protein_design_start. No OpenDDE compute service is used."

[[plugin.contributes.tools]]
name = "protein_design_context"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_context_tool"

[[plugin.contributes.tools]]
name = "protein_design_start"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_start_tool"

[[plugin.contributes.tools]]
name = "protein_design_status"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_status_tool"

[[plugin.contributes.tools]]
name = "protein_design_candidates"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_candidates_tool"

[[plugin.contributes.tools]]
name = "protein_model_list"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_list_tool"

[[plugin.contributes.tools]]
name = "protein_model_submit"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_submit_tool"

[[plugin.contributes.tools]]
name = "protein_model_status"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_status_tool"

[[plugin.contributes.tools]]
name = "protein_model_results"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_results_tool"

[[plugin.contributes.tools]]
name = "protein_model_cancel"
factory = "opendde_harness.plugin.protein_design.tools.models:make_model_cancel_tool"

[[plugin.contributes.tools]]
name = "protein_model_ppiflow"
factory = "opendde_harness.plugin.protein_design.tools.models:make_ppiflow_tool"

[[plugin.contributes.tools]]
name = "protein_model_torchcraft"
factory = "opendde_harness.plugin.protein_design.tools.models:make_torchcraft_tool"

[[plugin.contributes.tools]]
name = "protein_model_torchfold"
factory = "opendde_harness.plugin.protein_design.tools.models:make_torchfold_tool"

[[plugin.contributes.tools]]
name = "protein_model_af3score"
factory = "opendde_harness.plugin.protein_design.tools.models:make_af3score_tool"

[[plugin.contributes.tools]]
name = "protein_model_rosetta"
factory = "opendde_harness.plugin.protein_design.tools.models:make_rosetta_tool"

[[plugin.contributes.tools]]
name = "protein_model_torchscore"
factory = "opendde_harness.plugin.protein_design.tools.models:make_torchscore_tool"

[[plugin.contributes.tools]]
name = "protein_model_torchopt"
factory = "opendde_harness.plugin.protein_design.tools.models:make_torchopt_tool"


[[plugin.contributes.tools]]
name = "protein_design_resume"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_resume_tool"

[[plugin.contributes.tools]]
name = "protein_design_list"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_list_tool"

[[plugin.contributes.tools]]
name = "protein_design_analyze"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_analysis_tool"

[[plugin.contributes.tools]]
name = "protein_design_regions"
factory = "opendde_harness.plugin.protein_design.tools.workflow:make_regions_tool"

[[plugin.contributes.tools]]
name = "protein_design_mutation_selector"
factory = "opendde_harness.plugin.protein_design.scientific_agent.mutation_selector:make_mutation_selector_tool"
